<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nail Health Monitor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon" style="margin: 0 auto 0.75rem auto; width: 40px; height: 40px; font-size: 1.3rem;">NH</div>
        <h2>Nail Health Monitor</h2>
        <p>AI-Powered Nail Health Screening & Monitoring</p>
      </div>

      {% if error %}
      <div class="alert alert-danger">
        {{ error }}
      </div>
      {% endif %}

      <form action="/login" method="post">
        <div class="form-group">
          <label class="form-label" for="name">Name</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name" value="{{ name or '' }}">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Register here</a>
      </div>
    </div>

    <div class="disclaimer-banner" style="margin-top: 1.25rem;">
      <span class="disclaimer-icon">ℹ️</span>
      <div>
        <strong>Notice:</strong> This application provides AI-based screening and monitoring only. It is not a clinical medical diagnosis.
      </div>
    </div>
  </div>
</body>
</html>
